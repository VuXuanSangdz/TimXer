name: CD — Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build và push image public
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-voice-age:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-voice-age:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
