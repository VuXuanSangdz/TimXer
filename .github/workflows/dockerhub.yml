name: CD — Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Yêu cầu secret Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Thiếu DOCKERHUB_USERNAME hoặc DOCKERHUB_TOKEN. Thêm ở Settings → Secrets and variables → Actions (token quyền Read & Write, repo Public), rồi chạy lại workflow này."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build và push image public
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-voice-age:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-voice-age:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
