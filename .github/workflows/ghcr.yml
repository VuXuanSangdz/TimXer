name: CD — GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vuxuansangdz/timexer-dinov3-voice-age:latest
            ghcr.io/vuxuansangdz/timexer-dinov3-voice-age:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/VuXuanSangdz/TimXer
            org.opencontainers.image.description=TimeXer-DINOv3 voice-age ONNX inference
          cache-from: type=gha
          cache-to: type=gha,mode=max
